[package]
name = "inkling"
version = "0.1.0"
edition = "2021"
description = "Hand-fused Metal inference engine for Thinking Machines Inkling 2 Mini (inkling2_loop)"

[dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
block2 = "0.6"
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
